name: Lint Codebase

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linters
        run: npm install -g stylelint stylelint-config-standard htmlhint

      - name: Verify HTML Structure
        run: htmlhint index.html

      - name: Verify CSS Quality
        run: npx stylelint style.css --config '{"extends": ["stylelint-config-standard"]}'
